name: iReview43 Build 8 validation
permissions:
  contents: read
jobs:
  native-validation:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: iReview43
    steps:
    - uses: actions/checkout@v4
    - name: Extract isolated candidate
      working-directory: .
      run: unzip -oq iReview43_Build8_ValidatedIdentity.zip
    - name: Record Xcode version
      run: xcodebuild -version
    - name: Install XcodeGen
      run: brew install xcodegen
    - name: Source and calculation checks
      run: 'python3 -m venv "$RUNNER_TEMP/qa-python"

        "$RUNNER_TEMP/qa-python/bin/pip" install Pillow

        "$RUNNER_TEMP/qa-python/bin/python" QA/check_source.py

        swiftc -parse-as-library Sources/EnergyMath.swift QA/energy_math_test.swift -o "$RUNNER_TEMP/energy-math"

        "$RUNNER_TEMP/energy-math"

        '
    - name: Generate Xcode project
      run: xcodegen generate
    - name: Build iPhone simulator app
      run: 'set -o pipefail

        xcodebuild -project iReview43.xcodeproj -scheme iReview43 -sdk iphonesimulator -destination ''generic/platform=iOS
        Simulator'' -derivedDataPath build -resultBundlePath build.xcresult CODE_SIGNING_ALLOWED=NO build | tee build.log

        '
    - name: Test native flows and capture actual app screens
      run: 'set -o pipefail

        DEVICE=$(xcrun simctl list devices available -j | python3 -c ''import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values()
        for d in ds if d["name"].startswith("iPhone")))'')

        xcodebuild -project iReview43.xcodeproj -scheme iReview43 -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath
        native-tests.xcresult CODE_SIGNING_ALLOWED=NO test | tee native-tests.log

        '
    - name: Export genuine screenshot attachments
      run: xcrun xcresulttool export attachments --path native-tests.xcresult --output-path screenshots
    - name: Preserve diagnostics and genuine screenshot attachments
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: iReview43-Build8-validation
        path: 'iReview43/*.log

          iReview43/*.xcresult


          iReview43/screenshots'
        if-no-files-found: warn
    - name: Configure App Store Connect API authentication
      env:
        API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
        ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      run: 'test -n "$API_KEY" && test -n "$KEY_ID" && test -n "$ISSUER_ID" && test -n "$TEAM_ID"

        mkdir -p "$HOME/private_keys"

        printf ''%s\n'' "$API_KEY" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

        chmod 600 "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

        echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${KEY_ID}.p8" >> "$GITHUB_ENV"

        '
      if: github.event_name == 'push' && github.ref == 'refs/heads/work/ireview43-build8'
    - name: Install iEnergy distribution signing assets
      env:
        SIGNING_ASSETS: ${{ secrets.IENERGY_SIGNING_ASSETS }}
      run: "python3 - <<'PYSIGN'\nimport os, json, base64, subprocess, plistlib\nfrom pathlib import Path\na=json.loads(os.environ['SIGNING_ASSETS'])\n\
        temp=Path(os.environ['RUNNER_TEMP'])\np12=temp/'ienergy-distribution.p12'\np12.write_bytes(base64.b64decode(a['p12']))\n\
        profile=base64.b64decode(a['profile'])\nfrom datetime import datetime, timezone\nmetadata=plistlib.loads(subprocess.check_output(['security','cms','-D'],input=profile))\n\
        assert metadata['Entitlements']['application-identifier']=='F3639777XM.com.ienergyidata.ios', 'Wrong provisioning\
        \ identity'\nassert metadata['ExpirationDate'] > datetime.now(timezone.utc).replace(tzinfo=None), 'Expired provisioning\
        \ profile'\nfolder=Path.home()/'Library/MobileDevice/Provisioning Profiles'\nfolder.mkdir(parents=True,exist_ok=True)\n\
        (folder/(a['uuid']+'.mobileprovision')).write_bytes(profile)\nmodern=Path.home()/'Library/Developer/Xcode/UserData/Provisioning\
        \ Profiles'\nmodern.mkdir(parents=True,exist_ok=True)\n(modern/(a['uuid']+'.mobileprovision')).write_bytes(profile)\n\
        keychain=str(temp/'ienergy-signing.keychain-db')\nimport secrets\nkeypass=secrets.token_urlsafe(32)\ndef run(*args):\
        \ subprocess.run(args,check=True,stdout=subprocess.DEVNULL)\nrun('security','create-keychain','-p',keypass,keychain)\n\
        run('security','set-keychain-settings','-lut','21600',keychain)\nrun('security','unlock-keychain','-p',keypass,keychain)\n\
        run('security','import',str(p12),'-P',a['password'],'-T','/usr/bin/codesign','-T','/usr/bin/security','-t','cert','-f','pkcs12','-k',keychain)\n\
        run('security','set-key-partition-list','-S','apple-tool:,apple:,codesign:','-s','-k',keypass,keychain)\nrun('security','list-keychains','-d','user','-s',keychain)\n\
        options={'method':'app-store-connect','destination':'export','signingStyle':'manual','teamID':'F3639777XM','signingCertificate':a['certificate_sha1'],'provisioningProfiles':{'com.ienergyidata.ios':a['name']}}\n\
        Path('ExportOptions.plist').write_bytes(plistlib.dumps(options))\nwith open(os.environ['GITHUB_ENV'],'a') as f:\n\
        \    f.write('IENERGY_KEYCHAIN_PATH='+keychain+'\\n')\n    f.write('IENERGY_PROFILE_UUID='+a['uuid']+'\\n')\np12.unlink()\n\
        PYSIGN\n"
      if: github.event_name == 'push' && github.ref == 'refs/heads/work/ireview43-build8'
    - name: Archive and export signed IPA
      env:
        KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
        ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      run: 'xcodebuild -project iReview43.xcodeproj -scheme iReview43 -configuration Release -destination ''generic/platform=iOS''
        -archivePath "$RUNNER_TEMP/iReview43.xcarchive" -allowProvisioningUpdates -authenticationKeyPath "$APPLE_API_KEY_PATH"
        -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION=8
        MARKETING_VERSION=1.0 CODE_SIGNING_ALLOWED=NO archive

        xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/iReview43.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist
        ExportOptions.plist -allowProvisioningUpdates -authenticationKeyPath "$APPLE_API_KEY_PATH" -authenticationKeyID "$KEY_ID"
        -authenticationKeyIssuerID "$ISSUER_ID"

        '
      if: github.event_name == 'push' && github.ref == 'refs/heads/work/ireview43-build8'
    - name: Upload to TestFlight
      uses: apple-actions/upload-testflight-build@v5
      with:
        app-path: ${{ runner.temp }}/export/iReview43.ipa
        issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
        api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
        api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      if: github.event_name == 'push' && github.ref == 'refs/heads/work/ireview43-build8'
    - name: Remove API key
      run: "if [ -n \"$APPLE_API_KEY_PATH\" ]; then rm -f \"$APPLE_API_KEY_PATH\"; fi\nif [ -n \"$IENERGY_KEYCHAIN_PATH\"\
        \ ]; then security delete-keychain \"$IENERGY_KEYCHAIN_PATH\"; fi\nif [ -n \"$IENERGY_PROFILE_UUID\" ]; then\n  rm\
        \ -f \"$HOME/Library/MobileDevice/Provisioning Profiles/$IENERGY_PROFILE_UUID.mobileprovision\"\n  rm -f \"$HOME/Library/Developer/Xcode/UserData/Provisioning\
        \ Profiles/$IENERGY_PROFILE_UUID.mobileprovision\"\nfi\n"
      if: always()
'on':
  push:
    branches:
    - work/ireview43-build8
    paths:
    - iReview43_Build8_ValidatedIdentity.zip
    - .github/workflows/ireview43-validation.yml
  pull_request:
    paths:
    - iReview43_Build8_ValidatedIdentity.zip
    - .github/workflows/ireview43-validation.yml
  workflow_dispatch: null
