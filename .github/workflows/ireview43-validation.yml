name: iReview43 Build 9 validation
permissions:
  contents: read
jobs:
  native-validation:
    runs-on: macos-15-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: iReview43
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Extract isolated Build 9 source
      working-directory: .
      run: unzip -oq iReview43_Build9_Source_Candidate.zip -x ".github/*"
    - name: Verify pinned macOS Intel and Xcode toolchain
      run: |
        test -d "$DEVELOPER_DIR"
        sw_vers
        uname -m
        xcodebuild -version
        xcrun --sdk iphonesimulator --show-sdk-version
    - name: Install XcodeGen
      run: brew install xcodegen
    - name: Source and calculation checks
      run: |
        python3 -m venv "$RUNNER_TEMP/qa-python"
        "$RUNNER_TEMP/qa-python/bin/pip" install Pillow
        "$RUNNER_TEMP/qa-python/bin/python" QA/check_source.py
        swiftc -parse-as-library Sources/EnergyMath.swift QA/energy_math_test.swift -o "$RUNNER_TEMP/energy-math"
        "$RUNNER_TEMP/energy-math"
        swiftc -parse-as-library Sources/DispatchStudy.swift QA/dispatch_math_test.swift -o "$RUNNER_TEMP/dispatch-math"
        "$RUNNER_TEMP/dispatch-math"
    - name: Generate Xcode project
      run: xcodegen generate
    - name: Build iPhone simulator app
      run: |
        set -o pipefail
        xcodebuild -project iReview43.xcodeproj -scheme iReview43 -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build -resultBundlePath build.xcresult CODE_SIGNING_ALLOWED=NO build | tee build.log
    - name: Test native flows and capture actual app screens
      run: |
        set -o pipefail
        DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
        xcrun simctl boot "$DEVICE" || true
        xcrun simctl bootstatus "$DEVICE" -b
        xcodebuild -project iReview43.xcodeproj -scheme iReview43 -derivedDataPath build -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath native-tests.xcresult CODE_SIGNING_ALLOWED=NO test | tee native-tests.log
      timeout-minutes: 20
    - name: Export genuine screenshot attachments
      run: if [ -d native-tests.xcresult ]; then xcrun xcresulttool export attachments --path native-tests.xcresult --output-path
        screenshots; fi
      if: always()
    - name: Preserve diagnostics and genuine screenshot attachments
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: iReview43-Build9-validation
        path: |-
          iReview43/*.log
          iReview43/*.xcresult

          iReview43/screenshots
        if-no-files-found: warn
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
'on':
  push:
    branches:
    - fix/ireview43-apple-review
    paths:
    - iReview43_Build9_Source_Candidate.zip
    - .github/workflows/ireview43-validation.yml
  pull_request:
    paths:
    - iReview43_Build9_Source_Candidate.zip
    - .github/workflows/ireview43-validation.yml
  workflow_dispatch: null
concurrency:
  group: ireview43-build9-${{ github.ref }}
  cancel-in-progress: false
