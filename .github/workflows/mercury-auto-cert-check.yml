name: Mercury Auto certificate check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify certificate safely
        env:
          ASSETS: ${{ secrets.IENERGY_SIGNING_ASSETS }}
        run: |
          python3 - <<'PY'
          import os,json,base64,tempfile,subprocess
          from pathlib import Path
          a=json.loads(os.environ['ASSETS'])
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)/'signing.p12'
              p.write_bytes(base64.b64decode(a['p12']))
              env=dict(os.environ,CERT_PASS=a['password'])
              cmd=['openssl','pkcs12','-in',str(p),'-clcerts','-nokeys','-passin','env:CERT_PASS']
              r=subprocess.run(cmd,capture_output=True,env=env)
              if r.returncode: r=subprocess.run(cmd+['-legacy'],capture_output=True,env=env)
              assert r.returncode==0,'Cannot read certificate'
              c=Path(d)/'certificate.pem'; c.write_bytes(r.stdout)
              subprocess.run(['openssl','x509','-in',str(c),'-noout','-subject','-enddate'],check=True)
              subprocess.run(['openssl','x509','-in',str(c),'-noout','-checkend','86400'],check=True)
              print('Certificate valid. No private key exported.')
          PY
