name: Mercury Auto signed TestFlight
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deploy:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - name: Prepare Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/mercury-python"
          "$RUNNER_TEMP/mercury-python/bin/pip" install cryptography PyJWT
      - name: Sign and upload exclusively to Apple TestFlight
        env:
          ASSETS: ${{ secrets.IENERGY_SIGNING_ASSETS }}
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          export BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          "$RUNNER_TEMP/mercury-python/bin/python" mercury_auto_deploy.py
      - name: Remove local IPA copy
        if: always()
        run: rm -rf mercury_auto_output
