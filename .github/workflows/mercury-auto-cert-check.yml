name: Mercury Auto certificate check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: python3 -m pip install cryptography
      - name: Export public encryption key only
        env:
          ASSETS: ${{ secrets.IENERGY_SIGNING_ASSETS }}
        run: |
          python3 - <<'PY'
          import os,json,base64
          from cryptography.hazmat.primitives.serialization import pkcs12,Encoding,PublicFormat
          a=json.loads(os.environ['ASSETS'])
          _,cert,_=pkcs12.load_key_and_certificates(base64.b64decode(a['p12']),a['password'].encode())
          print('MERCURY_PUBLIC_KEY='+base64.b64encode(cert.public_key().public_bytes(Encoding.PEM,PublicFormat.SubjectPublicKeyInfo)).decode())
          PY
