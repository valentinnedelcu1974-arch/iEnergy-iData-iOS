name: Mercury Auto real screenshots
on: workflow_dispatch
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install xcodegen
      - run: python -m pip install cryptography PyJWT
      - name: Capture only genuine simulator screens
        env:
          ASSETS: ${{ secrets.IENERGY_SIGNING_ASSETS }}
        run: python mercury_auto_screenshots.py
      - uses: actions/upload-artifact@v4
        with:
          name: Mercury-Auto-real-iPhone-iPad-screenshots
          path: mercury_auto_screenshots
          if-no-files-found: error
          retention-days: 7
