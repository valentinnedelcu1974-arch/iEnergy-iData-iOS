name: Mercury iDeveloper existing certificate preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificate:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Validate existing certificate without export or Apple mutations
        env:
          SIGNING_ASSETS: ${{ secrets.IENERGY_SIGNING_ASSETS }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, secrets, shutil, subprocess, tempfile
          root=pathlib.Path(tempfile.mkdtemp(prefix='mercury-cert-check-',dir=os.environ['RUNNER_TEMP']))
          root.chmod(0o700)
          kc=root/'audit.keychain-db'
          def run(args):
              r=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if r.returncode: raise ValueError('Certificate validation command failed; sensitive details suppressed')
              return r.stdout
          try:
              a=json.loads(os.environ.pop('SIGNING_ASSETS'))
              p=root/'certificate.p12'
              p.write_bytes(base64.b64decode(a['p12'],validate=True)); p.chmod(0o600)
              password=secrets.token_urlsafe(40)
              run(['security','create-keychain','-p',password,str(kc)])
              run(['security','unlock-keychain','-p',password,str(kc)])
              run(['security','import',str(p),'-k',str(kc),'-P',a['password'],'-T','/usr/bin/security'])
              identities=run(['security','find-identity','-v','-p','codesigning',str(kc)]).decode()
              fingerprint=a['certificate_sha1']
              if not re.fullmatch(r'[A-Fa-f0-9]{40}',fingerprint): raise ValueError('Invalid certificate fingerprint metadata')
              if not re.search(fingerprint+r'\s+"Apple Distribution: [^"\n]*\(F3639777XM\)"',identities,re.I):
                  raise ValueError('Valid Apple Distribution certificate with private key for team F3639777XM not found')
              print('PASS: existing Apple Distribution identity and private key are valid for team F3639777XM.')
              print('Certificate SHA-1 (public metadata): '+fingerprint.upper())
              print('No certificate, private key, password or API key was exported. No Apple resources changed.')
          except Exception as e:
              print(str(e) if isinstance(e,ValueError) and not isinstance(e,json.JSONDecodeError) else 'Certificate preflight failed; sensitive details suppressed')
              raise SystemExit(1)
          finally:
              subprocess.run(['security','delete-keychain',str(kc)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              shutil.rmtree(root,ignore_errors=True)
          PY
