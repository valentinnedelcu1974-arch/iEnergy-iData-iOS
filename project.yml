name: iEnergyIData
options:
  bundleIdPrefix: com.ienergyidata
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  iEnergyIData:
    type: application
    platform: iOS
    sources: [iEnergyApp.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ienergyidata.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "iEnergy & iData"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
